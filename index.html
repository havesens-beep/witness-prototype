<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10243E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>위트니스 목격영상 마켓</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="gnb">
  <div class="gnb-inner">
    <a href="#/" class="logo" aria-label="위트니스 홈"><span class="logo-mark">W</span><span>위트니스</span></a>
    <nav class="gnb-nav" aria-label="주요 메뉴">
      <a href="#/search" data-nav="search">영상 찾기</a>
      <a href="#/requests" data-nav="requests">목격 요청</a>
      <a href="#/upload" data-nav="upload">영상 올리기</a>
      <a href="#/my" data-nav="my">마이</a>
    </nav>
    <div class="gnb-actions">
      <button class="icon-btn" aria-label="알림" onclick="toast('새 알림: 내 주변 500m에 목격 요청 1건')">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i class="dot"></i>
      </button>
      <button class="icon-btn" aria-label="전체 메뉴" onclick="openDrawer()">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabbar" aria-label="하단 탭">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>찾기</a>
  <a href="#/upload" data-tab="upload" class="tab-up"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>올리기</a>
  <a href="#/requests" data-tab="requests"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>요청</a>
  <a href="#/my" data-tab="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>MY</a>
</nav>

<div class="drawer-bg" id="drawerBg" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="화면 목록">
  <div class="drawer-head"><b>전체 메뉴</b><button class="icon-btn" onclick="closeDrawer()" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
